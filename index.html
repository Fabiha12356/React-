<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div id="root"></div>
     <div class="carousel">

    <input type="radio" name="slide" id="slide1" checked>
    <input type="radio" name="slide" id="slide2">
    <input type="radio" name="slide" id="slide3">

    <div class="carousel-track">

      <div class="slide">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80" alt="Beautiful landscape">

        <div class="caption">
          <h2>Explore Nature</h2>
          <p>Discover beautiful places around the world.</p>
        </div>

        <label for="slide3" class="arrow prev">&#10094;</label>
        <label for="slide2" class="arrow next">&#10095;</label>
      </div>

      <div class="slide">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=80" alt="Mountain lake">

        <div class="caption">
          <h2>Beautiful Mountains</h2>
          <p>Enjoy the beauty of peaceful destinations.</p>
        </div>

        <label for="slide1" class="arrow prev">&#10094;</label>
        <label for="slide3" class="arrow next">&#10095;</label>
      </div>

      <div class="slide">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1400&q=80" alt="Lake and mountains">

        <div class="caption">
          <h2>Find Your Adventure</h2>
          <p>Make every journey unforgettable.</p>
        </div>

        <label for="slide2" class="arrow prev">&#10094;</label>
        <label for="slide1" class="arrow next">&#10095;</label>
      </div>

    </div>

    <div class="dots">
      <label for="slide1"></label>
      <label for="slide2"></label>
      <label for="slide3"></label>
    </div>

  </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
